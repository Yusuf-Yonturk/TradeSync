name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l engine gateway processor marketmaker shared)"
      - name: vet
        run: go vet ./engine/... ./gateway/... ./processor/... ./marketmaker/... ./shared/...
      - name: test
        run: go test -race ./engine/... ./gateway/... ./processor/... ./marketmaker/... ./shared/...
      - name: build
        run: go build ./engine/... ./gateway/... ./processor/... ./marketmaker/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
