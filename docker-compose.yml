version: "3.9"

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tradesync-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
  
  postgres:
  image: postgres:16
  container_name: tradesync-postgres
  ports:
    - "5432:5432"

  enviroments:
    POSTGRES_DB: tradesync
    POSTGRES_USER: ts_user
    POSTGRES_PASSWORD: ts_pass
  volumes:
    - pg_data:/var/lib/postgresql/data
    - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: tradesync-redis
    ports:
      - "6379:6379"
    volumes:
      -redis_data:/data

volumes:
  kafka_data:
  pg_data:
  redis_data: