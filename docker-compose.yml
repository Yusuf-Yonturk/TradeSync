services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tradesync-kafka
    # Altyapi portlari sadece localhost'a acilir; docker 0.0.0.0'a baglarsa guvenlik duvarini da asar.
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT konteynerler arasi, EXTERNAL host uzerinden (localhost:9092) erisim icin
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka-setup:
    image: apache/kafka:3.9.0
    container_name: tradesync-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for kafka...';
      while ! /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092 >/dev/null 2>&1; do sleep 1; done;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic orders --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic trades --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic depth --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic events --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic order-updates --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-configs.sh --alter --entity-type topics --entity-name orders --add-config retention.ms=2592000000 --bootstrap-server kafka:9092;
      echo 'Topics created successfully';"
    # orders 30 gun saklanir: engine defteri diskteki goruntuden kurar, goruntu
    # kaybolursa bu sure icindeki emirlerden yeniden kurabilir.

  postgres:
    image: postgres:16
    container_name: tradesync-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: tradesync
      POSTGRES_USER: ts_user
      POSTGRES_PASSWORD: ts_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_user -d tradesync"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradesync-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    image: tradesync-gateway
    container_name: tradesync-gateway
    ports:
      - "8072:8072"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_DSN=postgres://ts_user:ts_pass@postgres:5432/tradesync
      - REDIS_ADDR=redis:6379
      # bos birakilirsa gateway her acilista gecici anahtar uretir
      - AUTH_SECRET=${AUTH_SECRET:-}
      # market maker hesaplarini gateway acar ve bakiye kontrolunden muaf tutar
      - MM_USERNAME=${MM_USERNAME:-marketmaker}
      - MM_PASSWORD=${MM_PASSWORD:-marketmaker-dev}
      - DEMO_FUNDS=${DEMO_FUNDS:-USD:100000,BTC:10,ETH:100,SOL:500}
      # vekil sunucu arkasinda gercek istemci adresini tasiyan baslik (ornegin X-Real-IP)
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  engine:
    build:
      context: .
      args:
        SERVICE: engine
    image: tradesync-engine
    container_name: tradesync-engine
    environment:
      - KAFKA_BROKERS=kafka:9092
      # defter buraya yazilir; acilista topic bastan okunmaz
      - SNAPSHOT_PATH=/data/snapshot.json
    volumes:
      - engine_data:/data
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  processor:
    build:
      context: .
      args:
        SERVICE: processor
    image: tradesync-processor
    container_name: tradesync-processor
    environment:
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_DSN=postgres://ts_user:ts_pass@postgres:5432/tradesync
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  marketmaker:
    build:
      context: .
      args:
        SERVICE: marketmaker
    image: tradesync-marketmaker
    container_name: tradesync-marketmaker
    environment:
      - GATEWAY_URL=http://gateway:8072
      - MM_USERNAME=${MM_USERNAME:-marketmaker}
      - MM_PASSWORD=${MM_PASSWORD:-marketmaker-dev}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  kafka_data:
  pg_data:
  redis_data:
  engine_data:
